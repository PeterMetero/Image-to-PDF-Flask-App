<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to PDF Converter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Sortable.js for drag-and-drop rearrangement -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Image to PDF Converter</h1>
        <p>Upload up to 30 images (PNG, JPG, JPEG) and drag them to rearrange the pages.</p>
        
        <input type="file" id="imageInput" multiple accept="image/png, image/jpeg" />
        
        <div id="sortableList" class="grid-container"></div>

        <button id="convertBtn" style="display:none;">Convert to PDF</button>
        <div id="loading" style="display:none;">Converting... Please wait.</div>
        <div id="result"></div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const sortableList = document.getElementById('sortableList');
        const convertBtn = document.getElementById('convertBtn');
        let selectedFiles = [];

        imageInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length > 30) {
                alert("You can only upload up to 30 images.");
                return;
            }
            selectedFiles = files;
            renderThumbnails();
        });

        function renderThumbnails() {
            sortableList.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const div = document.createElement('div');
                    div.className = 'thumbnail-card';
                    div.dataset.name = file.name;
                    div.innerHTML = `
                        <img src="${e.target.result}" />
                        <span>Page ${index + 1}</span>
                    `;
                    sortableList.appendChild(div);
                }
                reader.readAsDataURL(file);
            });
            if (selectedFiles.length > 0) {
                convertBtn.style.display = 'block';
            }
        }

        // Initialize Sortable
        new Sortable(sortableList, {
            animation: 150,
            onEnd: function () {
                // Update file array order based on DOM elements
                const cardElements = sortableList.children;
                const newOrderFiles = [];
                for (let card of cardElements) {
                    const name = card.dataset.name;
                    const fileObj = selectedFiles.find(f => f.name === name);
                    if (fileObj) newOrderFiles.push(fileObj);
                }
                selectedFiles = newOrderFiles;
            }
        });

        convertBtn.addEventListener('click', async () => {
            const formData = new FormData();
            selectedFiles.forEach(file => {
                formData.append('images', file);
                formData.append('order', file.name);
            });

            document.getElementById('loading').style.display = 'block';
            convertBtn.style.display = 'none';

            const response = await fetch('/api/convert', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            document.getElementById('loading').style.display = 'none';

            if (data.success) {
                document.getElementById('result').innerHTML = `<a href="${data.pdf_url}" target="_blank">Download Converted PDF</a>`;
            } else {
                alert(data.error || "Conversion failed");
                convertBtn.style.display = 'block';
            }
        });
    </script>
</body>
</html>
